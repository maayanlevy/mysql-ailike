name: release plugin
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: ./scripts/build-plugin.sh
      - run: tar -czf mysql-ailike-linux-${{ matrix.arch }}.tar.gz -C dist .
      - run: |
          mkdir bundle
          tar -xzf mysql-ailike-linux-${{ matrix.arch }}.tar.gz -C bundle
          python3 scripts/test.py --bundle bundle
          MYSQL_TEST_VERSION=8.0.46 python3 scripts/test.py --bundle bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plugin-${{ matrix.arch }}
          path: mysql-ailike-linux-${{ matrix.arch }}.tar.gz
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true
      - run: |
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" *.tar.gz SHA256SUMS --draft --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
