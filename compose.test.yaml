name: mysql-ailike-test
services:
  mysql:
    build:
      context: .
      args:
        MYSQL_RUNTIME_IMAGE: mysql:${MYSQL_TEST_VERSION:-8.4.8}
    image: mysql-ailike:test-${MYSQL_TEST_VERSION:-8.4.8}
    environment:
      MYSQL_ROOT_PASSWORD: local-ailike-test
      MYSQL_DATABASE: ailike_test
      TYPESAFE_API_KEY: test-key
      TYPESAFE_API_URL: http://mock:8080/v1/systemone
      AILIKE_TIMEOUT_MS: 1000
      AILIKE_CONNECT_TIMEOUT_MS: 500
      AILIKE_MAX_REQUESTS: 8
    tmpfs:
      - /var/lib/mysql
    depends_on:
      - mock
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 2s
      timeout: 3s
      retries: 60
  mock:
    image: python:3.12-slim
    command: ["python", "/mock.py"]
    volumes:
      - ./tests/mock_typesafe.py:/mock.py:ro
